# 每个 campaign 的功能验收计划唯一真源。技术方案 §5.1 只放本文件的可读摘要，不另维护第二份分工。
# cases 使用 AC 编号为键，便于 freeze / check 确定性对账；steps / evidence 使用内联列表。
#
# 完整测试 case 契约：
# 1. 每条 AC 必须可独立执行，写清需求来源、前置条件、测试数据、操作步骤、逐步预期、最终预期、验收标准与证据。
# 2. preconditions 同时声明测试环境、初始业务状态与测试数据；数据须给出输入值、样本量或已确认基准，不写“准备测试数据”。
# 3. steps 每项按“操作 + 输入 + 本步预期”书写；本步预期须可观察，最终业务结果统一写入 expected。
# 4. expected 是整条 case 的最终预期；assertions 是自动 / 混合 case 的自动验收标准，human_expect 是人工 / 混合 case 的人工验收标准。
# 5. 预期与验收标准统一写“观察对象 / 指标 + 比较符或精确目标值 + 数值与单位（适用时）+ 样本量 / 统计窗口（适用时）+ 数据来源”。
#    精确文本、状态或布尔结果可以直接写目标值；数量、比例、耗时、错误数等必须写数值与单位，不得只写“正常 / 合理 / 快速 / 正确 / 无异常”。
# 6. 所有阈值必须来自 PRD、change request 或已确认决策；上游未给阈值时进入技术方案待确认项，不得编造数值。
# 7. 以下数值仅演示完整写法，生成实际计划时必须替换为对应 AC 的已确认口径。
schema: agent-dev.feature-acceptance/v2
tech_spec: <tech-spec 文件名>
documents:
  prd:
    path: docs/features/<feature-module>/<feature-slug>/campaigns/<campaign-id>/<PRD 文件名>
    sha256: <PRD 文件的 64 位 SHA256>
  # 小变更路径必须登记 change_request；有 baseline PRD 时同时保留 prd。
  # change_request:
  #   path: docs/features/<feature-module>/<feature-slug>/campaigns/<campaign-id>/<change-request 文件名>
  #   sha256: <change-request 文件的 64 位 SHA256>
cases:
  AC-01:
    title: 示例：导入 20 条有效记录（替换为实际 AC）
    source: {document: prd, anchor: AC-01}
    required: true
    executor: command          # command | browser-agent | human：谁执行、采集结果
    oracle: auto               # auto | auto+human-review | human：谁作最终验收判断
    preconditions: ["环境：隔离测试库", "初始状态：目标表记录数 == 0 条", "测试数据：夹具含有效记录 20 条且重复记录 0 条"]
    steps: ["1. 操作：执行导入命令；输入：上述 20 条记录夹具；本步预期：进程退出码 == 0", "2. 操作：查询目标表；输入：本批次 20 个业务主键；本步预期：命中记录数 == 20 条且重复记录数 == 0 条"]
    expected: "20/20 条有效记录写入成功；失败记录数 == 0 条；目标表新增记录数 == 20 条；重复记录数 == 0 条"
    command: <executor=command 时填写实际执行入口>
    assertions:                # 自动验收标准：写计划预期，不写实现后的现状
      exit: 0
      output: "success_count == 20 条；failed_count == 0 条；inserted_count == 20 条；duplicate_count == 0 条"
    evidence: [log, output]
    human_reason:              # oracle=auto 留空；其余见下方固定词表
    human_steps: []            # 可空：空则复用 steps
    human_expect:              # auto 留空；人工 / 混合 case 必须写量化人工验收标准

  AC-02:
    title: 示例：从 3 条记录中筛选出 2 条匹配记录（替换为实际 AC）
    source: {document: prd, anchor: AC-02}
    required: true
    executor: browser-agent
    oracle: auto
    preconditions: ["环境：浏览器测试实例与只读测试账号", "初始状态：筛选条件为空", "测试数据：记录共 3 条，其中匹配关键词的记录 2 条、非匹配记录 1 条"]
    steps: ["1. 操作：打开列表页；输入：测试实例 URL；本步预期：列表请求 HTTP 200 且筛选控件可见数量 == 1 个", "2. 操作：执行筛选；输入：已确认匹配关键词；本步预期：匹配记录显示 2 条且非匹配记录显示 0 条"]
    expected: "3 条测试记录中命中 2 条；列表显示匹配记录 2 条、非匹配记录 0 条；筛选请求 HTTP 200；console error == 0 个且 page error == 0 个"
    assertions:
      dom: "matching_rows == 2 条；non_matching_rows == 0 条；filter_control_visible == 1 个"
      network: "filter_requests == 1 次；HTTP_200_responses == 1 次"
      console: "console_error_count == 0 个；page_error_count == 0 个"
    evidence: [screenshot, dom, network, console]
    human_reason:
    human_steps: []
    human_expect:

  AC-03:
    title: 示例：5 种视口展示记录详情并由人复核版式（替换为实际 AC）
    source: {document: prd, anchor: AC-03}
    required: true
    executor: browser-agent
    oracle: auto+human-review
    preconditions: ["环境：浏览器测试实例与只读测试账号", "测试数据：详情记录 1 条，含 200 字符标题与中英文混排正文", "视口样本：375×800、768×1024、1280×800、1440×900、1920×1080 共 5 种"]
    steps: ["1. 操作：逐一打开 5 种视口的详情页；输入：同一详情记录 URL；本步预期：5/5 页面请求均为 HTTP 200", "2. 操作：逐视口采集 DOM、console 与截图；输入：上述 5 种视口；本步预期：5/5 视口的必填字段均可见且截图各 1 张"]
    expected: "5/5 视口均返回 HTTP 200；5/5 视口的必填字段完整可见；console error == 0 个且 page error == 0 个；5/5 视口通过人工版式检查"
    assertions:
      dom: "5/5 视口的必填字段可见数 == 需求规定字段总数；horizontal_overflow_count == 0 个"
      network: "detail_requests == 5 次；HTTP_200_responses == 5 次"
      console: "console_error_count == 0 个；page_error_count == 0 个"
    evidence: [screenshot, dom, network, console]
    human_reason: visual-ux    # intent | visual-ux | domain-judgment | high-risk |
                               # no-reliable-oracle | environment-unavailable | evidence-insufficient
    human_steps: ["1. 操作：逐张复核 5 张视口截图；输入：自动执行采集的截图；本步预期：每张截图均完成文字截断、控件重叠与横向滚动检查"]
    human_expect: "5/5 视口均无文字截断、控件重叠与非预期横向滚动；缺陷数 == 0 处，任一样本出现 1 处即不通过"

  AC-04:
    title: 示例：人工核对 10 份领域报告的关键结论（替换为实际 AC）
    source: {document: prd, anchor: AC-04}
    required: true
    executor: human
    oracle: human
    preconditions: ["环境：候选报告只读访问地址", "测试数据：代表性报告 10 份，每份含 3 条已确认基准关键事实，共 30 条", "判定依据：逐条使用已确认基准，不凭主观印象补充结论"]
    steps: ["1. 操作：逐份打开报告并对照基准；输入：10 份报告与对应 30 条关键事实；本步预期：10/10 报告均完成逐项核对", "2. 操作：登记事实错误与关键结论遗漏；输入：逐项核对结果；本步预期：每份报告均记录通过项数、错误数与遗漏数"]
    expected: "10/10 报告完成核对；30/30 关键事实与已确认基准一致；事实性错误 == 0 条且关键结论遗漏 == 0 条"
    evidence: [human-review-record]
    human_reason: domain-judgment
    human_steps: []            # 空则复用 steps
    human_expect: "10/10 报告完成核对；30/30 关键事实与基准一致；事实性错误 == 0 条且关键结论遗漏 == 0 条"

# 分类纪律：
# 1. 预期来自已确认需求，且能安全执行、稳定观察、客观断言 → auto；有 UI 操作优先 browser-agent。
# 2. 功能可自动断言，但意图 / 视觉手感 / 领域合理性 / 高风险后果需人判断 → auto+human-review。
# 3. 没有可靠机器判据，或当前环境无法安全执行 → human；不得把未执行写成通过。
# 4. 收口时只能向更严格方向调整（auto → auto+human-review → human，或自动执行 → human），
#    并在结果 reclassification 记录原因；降低人工要求必须回到技术方案修订计划。
#
# 整案通过规则：每条 required case 的全部自动与人工验收标准均满足，且证据齐备，才可判通过；
# 任一项失败即为不通过，未执行、无可靠判据或证据不足只能记 unverified，不得计入通过。
